# Device Configuration Settings
# Copy this file as config.ini and customize for your environment

[console]
# Serial port settings
port = COM6
baudrate = 9600
timeout = 10
parity = none
stopbits = 1
bytesize = 8

[target_device]
# Target device via telnet
ip_address = 1.1.1.1
telnet_port = 2002
username = 
password = 

[ssh_connection]
# Optional: Direct SSH/Netmiko connection
enable_ssh = false
device_type = cisco_ios
ssh_port = 22
ssh_username = admin
ssh_password = 
enable_secret = 

[commands]
# Configuration commands (one per line, or use JSON format below)
# Example:
# configure terminal
# interface GigabitEthernet0/0/1
# ip address 192.168.1.1 255.255.255.0
# no shutdown
# exit
# exit
# write memory

[logging]
# Logging settings
enable_logging = true
log_file = device_config.log
log_level = INFO
